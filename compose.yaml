name: ailox-blog

services:

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - ailox

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local
      http://minio:9000
      $$MINIO_ROOT_USER
      $$MINIO_ROOT_PASSWORD
      &&
      mc mb --ignore-existing
      local/$$S3_BUCKET
      "

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

    networks:
      - ailox


  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ailox

  # This service is not started by ordinary `docker compose up`.
  # Run it manually before the first app start and after schema changes:
  # docker compose --profile tools run --rm db-init
  db-init:
    profiles:
      - tools
    image: ailox-blog-tools:local
    build:
      context: .
      target: tools
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - ailox

  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"



    image: ailox-blog-app:local
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:?SITE_URL is required}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,db,minio


    depends_on:
      db:
        condition: service_healthy

      minio:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/')
          .then(r => process.exit(r.status < 500 ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ailox

volumes:
  postgres_data:
  minio_data:
networks:
  ailox:
    driver: bridge
